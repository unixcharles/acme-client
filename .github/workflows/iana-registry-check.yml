name: IANA Registry Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 'ruby'
        bundler-cache: true
    - name: Check gem against the live IANA ACME error registry
      id: check
      run: bundle exec rake spec_iana_registry
    - name: File a warning issue on drift
      if: failure() && steps.check.outcome == 'failure'
      uses: actions/github-script@v9
      with:
        script: |
          const label = 'iana-registry-drift';
          const { data: openIssues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          if (openIssues.length > 0) {
            console.log(`Drift issue already open: #${openIssues[0].number}, skipping.`);
            return;
          }

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'IANA ACME error registry has drifted',
            labels: [label],
            body: [
              'The weekly check against the live IANA ACME error type registry failed:',
              '',
              `${runUrl}`,
              '',
              'This usually means IANA registered a new ACME error type (or changed a description) ' +
              'that this gem does not yet reflect.',
              '',
              'Run `bundle exec rake spec_iana_registry` locally for details.',
              '',
              'Closing this issue is safe once the gem is updated to match — it will reopen ' +
              '(a new one will be filed) the next time the check fails.',
            ].join('\n'),
          });
